<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>labelpipe review</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; display: grid; grid-template-columns: 2fr 1fr; height: 100vh; }
  #doc { padding: 16px; white-space: pre-wrap; font-family: ui-monospace, monospace; overflow: auto; border-right: 1px solid #ddd; }
  #panel { padding: 16px; }
  .redacted { background: #111; color: #111; border-radius: 2px; user-select: none; }
  button { font: inherit; padding: 4px 12px; }
  .flag { background: #fff4e5; border-left: 4px solid #faad14; padding: 8px 12px; }
  .invalid { color: #cf1322; }
</style>
</head>
<body>
<main id="doc">Loading…</main>
<aside id="panel"></aside>
<script>
// Everything goes through textContent: log text is untrusted and must never be parsed as HTML.
const doc = document.getElementById("doc"), panel = document.getElementById("panel");
const button = (label, onclick) => { const b = document.createElement("button"); b.textContent = label; b.onclick = onclick; return b; };

// DOM selection point -> code-point offset into the raw text (JS offsets are UTF-16 units).
function rawOffset(node, off) {
  const seg = node.nodeType === Node.TEXT_NODE ? node.parentElement : null;
  if (!seg || seg.dataset.start === undefined) return null;  // outside text, or inside a redaction
  return Number(seg.dataset.start) + [...node.data.slice(0, off)].length;
}

async function decide(docId, body) {
  const r = await fetch(`/records/${docId}/decision`, {method: "POST", headers: {"content-type": "application/json"},
    body: JSON.stringify(body)});
  if (!r.ok) { alert(`Refused (${r.status}): ${(await r.json()).detail}`); return; }
  load();
}

async function load() {
  doc.replaceChildren(); panel.replaceChildren();
  const r = await fetch("/records/next");
  if (!r.ok) { doc.textContent = "No records pending review."; return; }
  const rec = await r.json();
  for (const s of rec.segments) {
    const el = document.createElement("span");
    if ("redacted" in s) { el.className = "redacted"; el.title = s.redacted; el.textContent = "█".repeat(8); }
    else { el.textContent = s.text; el.dataset.start = s.start; }
    doc.append(el);
  }
  const list = (title, items, cls) => {
    const box = document.createElement("div"); box.className = cls;
    const t = document.createElement("strong"); t.textContent = title; box.append(t);
    const ul = document.createElement("ul");
    for (const it of items) { const li = document.createElement("li"); li.textContent = it; ul.append(li); }
    box.append(ul); panel.append(box);
  };
  if (rec.needs_second_look) list("Needs second look", rec.adjudication_reasons, "flag");
  const h = document.createElement("h3"); h.textContent = "Proposals for " + rec.doc_id; panel.append(h);
  rec.proposals.forEach((p, i) => {
    const row = document.createElement("p");
    row.textContent = `${p.label} [${p.start}, ${p.end}) `;
    row.append(button("Accept", () => decide(rec.doc_id, {action: "accept", span_index: i})),
      button("Rewrite", () => {
        const sel = getSelection();
        const range = sel.rangeCount && sel.getRangeAt(0);
        const start = range && rawOffset(range.startContainer, range.startOffset);
        const end = range && rawOffset(range.endContainer, range.endOffset);
        if (start == null || end == null || start >= end) { alert("Select the new span in the document text first."); return; }
        const label = prompt(`Label for [${start}, ${end})`, p.label);
        if (label) decide(rec.doc_id, {action: "rewrite", span_index: i, new_start: start, new_end: end, new_label: label});
      }));
    panel.append(row);
  });
  if (rec.validation.length) list("Validation: will fail", rec.validation, "invalid");
  else { const ok = document.createElement("p"); ok.textContent = "Validation: all proposals pass"; panel.append(ok); }
  const actions = document.createElement("p");
  for (const a of ["skip", "reject", "escalate"])
    actions.append(button(a[0].toUpperCase() + a.slice(1), () => decide(rec.doc_id, {action: a})), " ");
  panel.append(actions);
}
load();
</script>
</body>
</html>
