[project]
name = "labelpipe"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "spacy",
    "presidio-analyzer",
    "presidio-anonymizer",
    "pydantic",
    "fastapi",
    "uvicorn",
]

[project.scripts]
labelpipe = "labelpipe.cli:main"

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labelpipe"]
